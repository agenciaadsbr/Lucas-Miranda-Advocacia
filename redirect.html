<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contato recebido | Lucas Miranda Advocacia</title>
<meta name="robots" content="noindex,nofollow">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=AW-18466116802"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'AW-18466116802');
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy-900:#0A1524;
  --navy-800:#101E33;
  --white-soft:rgba(255,255,255,.72);
  --white-faint:rgba(255,255,255,.42);
  --rule:rgba(255,255,255,.30);
  --wa:#1FA855;
  --wa-dark:#17853F;
  --sans:"Montserrat",system-ui,-apple-system,sans-serif;
  --serif:"Cormorant Garamond",Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100svh;display:grid;place-items:center;padding:28px;text-align:center;
  background:linear-gradient(180deg,var(--navy-800) 0%,var(--navy-900) 70%);
  color:#fff;font-family:var(--sans);line-height:1.66;
}
:focus-visible{outline:2px solid var(--wa);outline-offset:3px}
.caixa{max-width:470px;width:100%}
.logo{display:flex;align-items:center;justify-content:center;gap:12px;color:#fff}
.logo img{height:26px;width:auto;display:block}
.selo{margin:38px auto 0;width:78px;height:78px;position:relative;display:grid;place-items:center}
.selo svg.anel{position:absolute;inset:0;transform:rotate(-90deg)}
.selo circle{fill:none;stroke-width:2}
.selo .trilho{stroke:var(--rule)}
.selo .arco{stroke:var(--wa);stroke-linecap:round;stroke-dasharray:233;stroke-dashoffset:233;animation:contar 3s linear forwards}
.selo .check{width:25px;height:25px;stroke:var(--wa);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:36;stroke-dashoffset:36;animation:risca .5s ease .35s forwards}
h1{font-weight:800;text-transform:uppercase;font-size:clamp(1.4rem,4.4vw,2rem);line-height:1.2;margin-top:30px}
.rule{width:76px;height:1px;background:var(--rule);margin:20px auto}
p.lede{color:var(--white-soft);font-size:1rem;max-width:34ch;margin-inline:auto}
.acao{
  margin-top:32px;display:inline-flex;align-items:center;justify-content:center;gap:10px;
  background:var(--wa);color:#fff;text-decoration:none;font-weight:700;font-size:.95rem;
  padding:17px 28px;border-radius:3px;transition:background .18s ease;
}
.acao:hover{background:var(--wa-dark)}
.nota{margin-top:18px;font-size:.78rem;color:var(--white-faint)}
@keyframes contar{to{stroke-dashoffset:0}}
@keyframes risca{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){
  .selo .arco,.selo .check{animation:none;stroke-dashoffset:0}
}
</style>
</head>
<body>

<main class="caixa">
  <div class="logo">
    <img src="logo.png" alt="Lucas Miranda Advocacia" width="560" height="91">
  </div>

  <div class="selo" aria-hidden="true">
    <svg class="anel" viewBox="0 0 78 78"><circle class="trilho" cx="39" cy="39" r="37"></circle><circle class="arco" cx="39" cy="39" r="37"></circle></svg>
    <svg class="check" viewBox="0 0 24 24"><path d="M5 12.5 10 17.5 19 7"/></svg>
  </div>

  <h1 id="titulo">Recebemos o seu contato</h1>
  <div class="rule"></div>
  <p class="lede">Estamos te levando para o WhatsApp do escritório.</p>

  <a class="acao" id="manual" href="#">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.47 14.38c-.3-.15-1.75-.86-2.02-.96-.27-.1-.47-.15-.67.15-.2.3-.77.96-.94 1.16-.17.2-.35.22-.64.07-.3-.15-1.25-.46-2.38-1.47-.88-.78-1.47-1.75-1.64-2.05-.17-.3-.02-.46.13-.6.13-.14.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.6-.92-2.2-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.8.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.22 3.08c.15.2 2.1 3.2 5.08 4.49.71.3 1.26.49 1.69.63.71.22 1.36.19 1.87.12.57-.09 1.75-.72 2-1.41.25-.7.25-1.29.17-1.41-.07-.13-.27-.2-.57-.35M12.04 21.5h-.01a9.4 9.4 0 0 1-4.79-1.31l-.34-.2-3.56.93.95-3.47-.22-.36a9.36 9.36 0 0 1-1.44-5 9.47 9.47 0 0 1 16.17-6.7 9.38 9.38 0 0 1 2.77 6.7c0 5.18-4.23 9.41-9.53 9.41M20.5 3.49A11.8 11.8 0 0 0 12.04.01C5.5.01.2 5.31.2 11.83c0 2.08.55 4.12 1.59 5.91L.1 24l6.4-1.67a11.9 11.9 0 0 0 5.54 1.4h.01c6.53 0 11.84-5.3 11.84-11.82a11.74 11.74 0 0 0-3.4-8.42"/></svg>
    Abrir o WhatsApp
  </a>

  <p class="nota">Se a página não avançar sozinha, use o botão acima.</p>
</main>

<script>
/* ===== Configuração: trocar antes de publicar ===== */
const CONFIG = {
  whatsapp: "5587981857173",
  espera: 3000
};

const params = new URLSearchParams(location.search);
const nome = (params.get("n") || "").trim();
const numero = CONFIG.whatsapp;

if(nome){
  const primeiro = nome.split(" ")[0];
  document.getElementById("titulo").textContent = "Recebemos o seu contato, " + primeiro;
}

const texto = "Vim do Google e quero falar com um advogado especialista.";

const link = "https://wa.me/" + numero + "?text=" + encodeURIComponent(texto);
document.getElementById("manual").href = link;

/* ===== Conversão Google Ads ===== */
// dispara só para quem chegou pelo formulário, e uma vez por lead
let lead = null;
try{ lead = JSON.parse(sessionStorage.getItem("lead") || "null"); }catch(e){}
const jaConvertido = (function(){ try{ return sessionStorage.getItem("lead_convertido") === "1"; }catch(e){ return false; } })();

let tempoOk = false, tagOk = false, saiu = false;
function sair(){
  if(saiu) return;
  if(tempoOk && tagOk){ saiu = true; location.replace(link); }
}

if(lead && !jaConvertido){
  // <!-- Event snippet for LEAD ADSBR conversion page -->
  gtag('event', 'conversion', {
    'send_to': 'AW-18466116802/JCQuCODnkIAdEMKpquVE',
    'value': 1.0,
    'currency': 'BRL',
    'transaction_id': 'lm-' + (lead.data || Date.now()),
    'event_callback': function(){ tagOk = true; sair(); }
  });
  try{ sessionStorage.setItem("lead_convertido", "1"); }catch(e){}
  // se o Google demorar, não segura a pessoa além de 6 segundos
  setTimeout(function(){ tagOk = true; sair(); }, 6000);
}else{
  tagOk = true;
}

setTimeout(function(){ tempoOk = true; sair(); }, CONFIG.espera);
</script>
</body>
</html>
